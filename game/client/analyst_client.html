<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zero Sum - Analyst Desk</title>
<style>
  /* AFTERGLOW tokens (docs/VISUAL_REDESIGN.md §3.1) */
  :root { --bg:#0C1116; --panel:#141D26; --teal:#A5E3EE; --gold:#FFB454;
          --crim:#FF4A36; --toxic:#39FF14; --hurt:#FFB454; --text:#C2CDD5; }
  body { font-family: 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace; background: var(--bg); color: var(--text);
         margin: 0; padding: 12px; }
  h2 { color: var(--teal); font-size: 13px; letter-spacing: 3px; margin: 0 0 6px 0;
       border-bottom: 1px solid #2b3a4a; padding-bottom: 3px; }
  #grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid #2b3a4a; border-radius: 3px; padding: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { color: #8a95a3; text-align: left; font-weight: normal; padding: 2px 4px; }
  td { padding: 2px 4px; border-top: 1px solid #14181f; }
  tr.dead td { color: #8a95a3; }
  .team-chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
               margin-right: 4px; vertical-align: -1px; }
  .gold { color: var(--gold); } .crim { color: var(--crim); }
  .toxic { color: var(--toxic); } .tealc { color: var(--teal); }
  #topbar { display: flex; gap: 24px; align-items: baseline; margin-bottom: 10px; }
  #clock { font-size: 26px; color: var(--teal); letter-spacing: 2px; }
  #alive { font-size: 18px; color: var(--gold); }
  #zonebox { font-size: 13px; }
  #ticker { height: 260px; overflow-y: auto; font-size: 11px; }
  #ticker .row { padding: 2px 0; border-bottom: 1px solid #14181f; }
  #ticker .steal { color: var(--crim); font-weight: bold; }
  #ticker .settle { color: #E9E4D8; }
  #ticker .settle .victim { text-decoration: line-through; }
  #matrix td, #matrix th { text-align: center; }
  #matrixNote { font-size: 10px; color: #8a95a3; margin-top: 4px; }
  #finale { position: fixed; inset: 0; display: none; align-items: center;
            justify-content: center; background: rgba(255,74,54,0.12);
            pointer-events: none; z-index: 10; }
  #finale div { font-size: 64px; color: var(--crim); letter-spacing: 12px;
                text-shadow: 0 0 30px rgba(255,74,54,0.8); font-weight: bold; }
  #winner { position: fixed; inset: 0; display: none; align-items: flex-end;
            justify-content: center; padding-bottom: 7vh; box-sizing: border-box;
            pointer-events: none; z-index: 11; }
  #winner div { font-size: 48px; color: var(--gold); letter-spacing: 8px;
                text-shadow: 0 0 24px rgba(255,180,84,0.9); }
  .hpbar { height: 4px; background: #0d1117; }
  .hpbar i { display: block; height: 100%; }
  .wide { grid-column: 1 / -1; }
  #comms { height: 150px; overflow-y: auto; font-size: 11px; }
  #comms .row { padding: 1px 0; border-bottom: 1px solid #14181f; }
  #comms .ch-team { color: var(--teal); }
  #comms .ch-dm { color: var(--gold); }
  #mini { image-rendering: pixelated; display: block; }
  #timeline { display: block; width: 100%; height: 16px; margin-bottom: 10px;
              background: #10171E; border: 1px solid #2b3a4a; }
  #sndbtn { margin-left: auto; align-self: center; background: none;
            border: 1px solid #36444F; color: #8a95a3; font: inherit; font-size: 10px;
            letter-spacing: 2px; padding: 2px 8px; border-radius: 2px; cursor: pointer; }
  #sndbtn.on { color: var(--teal); border-color: var(--teal); }
  #sndbtn.armed { border-style: dashed; }
  #transport { align-self: center; display: flex; gap: 4px; }
  #transport button { background: none; border: 1px solid #36444F;
    color: #8a95a3; font: inherit; font-size: 10px; letter-spacing: 1px;
    padding: 2px 8px; border-radius: 2px; cursor: pointer; }
  #transport button:hover { color: var(--teal); border-color: var(--teal); }
  #timeline { cursor: pointer; }
  /* CVD redundancy: every team chip carries a distinct fill pattern in
     addition to its hue (letter glyph remains the guaranteed channel) */
  .chip-B { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.4) 0 2px, transparent 2px 4px); }
  .chip-C { background-image: radial-gradient(rgba(0,0,0,.45) 1px, transparent 1px); background-size: 4px 4px; }
  .chip-D { background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0 2px, transparent 2px 4px); }
  .chip-E { background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.4) 0 2px, transparent 2px 4px); }
  .chip-F { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.45) 0 3px, transparent 3px 6px); }
  .chip-G { background-image: linear-gradient(rgba(0,0,0,.45), transparent); }
  .chip-H { box-shadow: inset 0 0 0 2px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="topbar">
  <span id="clock">--:--</span>
  <span id="alive"></span>
  <span id="zonebox"></span>
  <span id="status" style="color:#8a95a3">connecting&hellip;</span>
  <button id="sndbtn" title="toggle event sounds">SND OFF</button>
  <span id="transport" title="replay transport (live matches ignore these)">
    <button data-c="pause">&#10074;&#10074;</button>
    <button data-c="play">&#9654;</button>
    <button id="spdbtn">&times;1</button>
  </span>
</div>
<canvas id="timeline" width="1200" height="16" title="click to seek (replay)"></canvas>
<div id="grid">
  <div class="panel">
    <h2>LIVE PROJECTED SCOREBOARD</h2>
    <table id="board"><thead><tr>
      <th></th><th>AGENT</th><th>HP</th><th>K</th><th>DMG</th><th>PLACE</th><th>PROJ</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <div class="panel">
    <h2>SOFTCOIN TICKER</h2>
    <table id="budgets"><tbody></tbody></table>
    <div id="ticker"></div>
  </div>
  <div class="panel">
    <h2>STAT MATRIX <span id="lockTag" class="crim"></span></h2>
    <table id="matrix"><thead><tr>
      <th>AGENT</th><th>SPD</th><th>STR</th><th>INT</th><th>ATH</th>
    </tr></thead><tbody></tbody></table>
    <div id="matrixNote"></div>
  </div>
  <div class="panel"><h2>MAP</h2><canvas id="mini" width="192" height="192"></canvas></div>
  <div class="panel wide">
    <h2>COMMS &mdash; PUBLIC RECORD</h2>
    <div id="comms"></div>
  </div>
</div>
<div id="finale"><div>CIVIL WAR</div></div>
<div id="winner"><div></div></div>
<script>
const pageUrl = new URL(window.location.href);
function websocketAddress(path) {
  const address = pageUrl.searchParams.get('address');
  const target = new URL(address || window.location.href, window.location.href);
  if (target.protocol === 'http:') target.protocol = 'ws:';
  if (target.protocol === 'https:') target.protocol = 'wss:';
  if (!address) target.pathname = target.pathname.replace(/\/client\/analyst$/, path);
  target.hash = '';
  return target;
}
// AFTERGLOW team wheel (VISUAL_REDESIGN §3.1)
const TEAM = {A:'#FF8FA8', B:'#49C7E8', C:'#E8C558', D:'#9B7BFF',
              E:'#E85D75', F:'#9FB8D8', G:'#E8975D', H:'#D97BE8'};
// server-supplied strings (names, sponsor item ids) must never reach
// innerHTML raw — a live sponsor socket can put arbitrary text in item_id
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamColor = t => TEAM[t] || '#56606a';
const el = id => document.getElementById(id);
let finaleShown = false, tickerKeys = new Set();
// MINIMAP: static arena cached from the first payload that carries it
let arenaMap = null;
const TILE_COLOR = {'#':'#36444F', 'F':'#4E5E6B', 'R':'#5a4a3a', 'P':'#FFB454', 'B':'#1e5c28'};
function drawMini(m) {
  const cv = el('mini');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0C1116';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (arenaMap) {
    for (let y = 0; y < arenaMap.length; y++) {
      const row = arenaMap[y];
      for (let x = 0; x < row.length; x++) {
        const c = TILE_COLOR[row[x]];
        if (c) { ctx.fillStyle = c; ctx.fillRect(x * 4, y * 4, 4, 4); }
      }
    }
  }
  // ring (Directive Magenta) + dashed next radius when a shrink is pending
  ctx.strokeStyle = '#FF4FA3';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(96, 96, m.zone.radius * 4, 0, Math.PI * 2);
  ctx.stroke();
  if (m.zone.next_radius !== undefined && m.zone.next_radius < m.zone.radius) {
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(96, 96, m.zone.next_radius * 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // agents: alive = 4px team square, dead = 2px dim dot
  for (const a of m.agents) {
    if (a.alive) {
      ctx.fillStyle = teamColor(a.team);
      ctx.fillRect(a.pos[0] * 4, a.pos[1] * 4, 4, 4);
    } else {
      ctx.fillStyle = '#8a95a3';
      ctx.fillRect(a.pos[0] * 4 + 1, a.pos[1] * 4 + 1, 2, 2);
    }
  }
}
function fmtT(tick) {
  const s = Math.floor(tick / 24);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
// ---- sound module (WebAudio event-sound v1 — VISUAL_REDESIGN Part 9) ----
// synthesized only, no assets; master ~0.12 (instrument-room quiet); default OFF.
// The toggle click is the autoplay-policy gesture: preference persists in
// localStorage but the AudioContext is only created/resumed by a click, every session.
let sndOn = false, sndCtx = null, sndGain = null, sndPrefOn = false, winnerSounded = false;
try { sndPrefOn = localStorage.getItem('zs_snd_analyst') === 'on'; } catch (_) {}
function sndActive() { return sndOn && sndCtx !== null && sndCtx.state === 'running'; }
function sndRenderBtn() {
  const b = el('sndbtn');
  if (!b) return;
  b.textContent = sndOn ? 'SND ON' : 'SND OFF';
  b.classList.toggle('on', sndOn);
  b.classList.toggle('armed', !sndOn && sndPrefOn);
  b.title = !sndOn && sndPrefOn ? 'sound preference saved ON — click to resume audio'
                                : 'toggle event sounds';
}
function sndToggle() {
  sndOn = !sndOn;
  if (sndOn) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) sndOn = false;
      else {
        if (!sndCtx) {
          sndCtx = new AC();
          sndGain = sndCtx.createGain();
          sndGain.gain.value = 0.12;
          sndGain.connect(sndCtx.destination);
        }
        if (sndCtx.state !== 'running') sndCtx.resume().catch(() => {});
      }
    } catch (_) { sndOn = false; }
  } else if (sndCtx && sndCtx.state === 'running') {
    try { sndCtx.suspend().catch(() => {}); } catch (_) {}
  }
  sndPrefOn = sndOn;
  try { localStorage.setItem('zs_snd_analyst', sndOn ? 'on' : 'off'); } catch (_) {}
  sndRenderBtn();
}
// fire-and-forget oscillator: envelope via gain ramps, explicit stop, no refs kept
function sndTone(freq, dur, type, vol, freqEnd, at) {
  if (!sndActive()) return;
  try {
    const t0 = sndCtx.currentTime + (at || 0);
    const o = sndCtx.createOscillator(), g = sndCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (freqEnd !== undefined) o.frequency.linearRampToValueAtTime(freqEnd, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g); g.connect(sndGain);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (_) {}
}
const sfxThunk  = at => { sndTone(90, 0.08, 'sine', 0.9, undefined, at || 0);   // ledger thunk
                          sndTone(1000, 0.03, 'sine', 0.3, undefined, (at || 0) + 0.08); };
const sfxStolen = () => { sndTone(440, 0.2, 'sine', 0.45);                      // minor-second wrongness
                          sndTone(466, 0.2, 'sine', 0.45); };
const sfxFinale = () => { sndTone(98, 0.18, 'sine', 0.9, undefined, 0.3);       // 300 ms silence, then slam
                          sndTone(87, 0.35, 'sine', 0.9, undefined, 0.5); };
const sfxWinner = () => sndTone(523, 1.5, 'triangle', 0.55);                    // sustained, fading
el('sndbtn').addEventListener('click', sndToggle);
sndRenderBtn();
// replay transport (VISUAL_REDESIGN §5.8): /control is only honored by the
// replay server; on live matches these calls are no-ops
let lastMax = 9120;
const SPEEDS = [0.5, 1, 2, 4];
let spdIx = 1;
const ctl = q => fetch('/control?' + q).catch(() => {});
for (const b of document.querySelectorAll('#transport button[data-c]'))
  b.onclick = () => ctl('cmd=' + b.dataset.c);
el('spdbtn').onclick = () => {
  spdIx = (spdIx + 1) % SPEEDS.length;
  el('spdbtn').innerHTML = '&times;' + SPEEDS[spdIx];
  ctl('cmd=speed&value=' + SPEEDS[spdIx]);
};
el('timeline').addEventListener('click', (e) => {
  const r = el('timeline').getBoundingClientRect();
  ctl('cmd=seek&tick=' +
      Math.max(0, Math.floor((e.clientX - r.left) / r.width * lastMax)));
});

const ws = new WebSocket(websocketAddress('/analyst'));
ws.onopen = () => { el('status').textContent = 'LIVE'; el('status').style.color = '#A5E3EE'; };
ws.onclose = () => { el('status').textContent = 'FEED CLOSED'; el('status').style.color = '#FF4A36'; };
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.type !== 'analyst') return;
  el('clock').textContent = fmtT(m.tick);
  el('alive').textContent = m.alive + ' ALIVE';
  const z = m.zone;
  let ringTxt = 'RING <span class="' + (z.damage_per_s >= 8 ? 'crim' : 'tealc') + '">r=' + z.radius + '</span> ' + z.damage_per_s + ' DMG/s';
  if (z.next_radius !== undefined && z.next_radius < z.radius) {
    ringTxt += z.shrink_tick > m.tick
      ? ' → ' + z.next_radius + ' in ' + Math.ceil((z.shrink_tick - m.tick) / 24) + 's'
      : ' → ' + z.next_radius + ' <span class="crim">NOW</span>';
  }
  el('zonebox').innerHTML = ringTxt;

  // match timeline strip: settlements in bone, airdrop landings in amber,
  // elapsed bar + now-cursor in magenta/phosphor
  {
    const tl = el('timeline'), tctx = tl.getContext('2d');
    const span = Math.max(m.max_ticks || 9120, m.tick + 1);
    lastMax = span;
    const X = t => Math.floor(t / span * tl.width);
    tctx.fillStyle = '#10171E'; tctx.fillRect(0, 0, tl.width, tl.height);
    tctx.fillStyle = 'rgba(255,79,163,0.45)';
    tctx.fillRect(0, tl.height - 3, X(m.tick), 3);
    for (const g of (m.ticker || [])) {
      if (g.landed_tick >= 0) {
        tctx.fillStyle = '#FFB454';
        tctx.fillRect(X(g.landed_tick), 4, 2, 8);
      }
    }
    for (const st of (m.settlements || [])) {
      tctx.fillStyle = '#E9E4D8';
      tctx.fillRect(X(st.tick), 0, 2, tl.height);
    }
    tctx.fillStyle = '#A5E3EE';
    tctx.fillRect(X(m.tick), 0, 2, tl.height);
  }

  // MINIMAP
  if (!arenaMap && m.arena) arenaMap = m.arena;
  drawMini(m);

  // scoreboard: sort by projected score desc, then placement
  const rows = [...m.agents].sort((a, b) => b.projected_score - a.projected_score || a.placement - b.placement);
  el('board').tBodies[0].innerHTML = rows.map(a => {
    // HP semaphore (VISUAL_REDESIGN §3.1): phosphor/amber/klaxon, no green
    const band = a.hp > 66 ? '#A5E3EE' : a.hp >= 33 ? '#FFB454' : '#FF4A36';
    return `<tr class="${a.alive ? '' : 'dead'}">
      <td><span class="team-chip chip-${esc(a.team)}" style="background-color:${teamColor(a.team)}"></span>${esc(a.team)}</td>
      <td>P${a.slot} ${esc(a.name || '')}</td>
      <td>${a.alive ? a.hp + '<div class="hpbar"><i style="width:' + a.hp + '%;background:' + band + '"></i></div>' : '<span class="crim">✝ ' + fmtT(a.death_tick) + '</span>'}</td>
      <td>${a.kills}</td><td>${a.damage_dealt}</td>
      <td>${a.placement}</td><td class="gold"><b>${a.projected_score}</b></td>
    </tr>`;
  }).join('');

  // budgets + ticker
  el('budgets').tBodies[0].innerHTML = '<tr>' + m.teams.map(t =>
    `<td><span class="team-chip chip-${esc(t.team)}" style="background-color:${teamColor(t.team)}"></span>${esc(t.team)} <b class="gold">${t.budget}</b></td>`).join('') + '</tr>';
  const tick = el('ticker');
  for (const g of m.ticker) {
    const key = 'g' + g.tick + g.team + g.item + g.recipient_slot;
    if (tickerKeys.has(key)) continue;
    tickerKeys.add(key);
    const d = document.createElement('div'); d.className = 'row';
    const dest = g.recipient_slot < 0
      ? `tile (${g.target ? esc(g.target[0]) + ',' + esc(g.target[1]) : '?,?'})`
      : `P${g.recipient_slot}`;
    d.innerHTML = g.status === 'accepted'
      ? `[${fmtT(g.tick)}] <span style="color:${teamColor(g.team)}">${esc(g.team)}</span> BUYS <span class="gold">${esc(g.item.toUpperCase())}</span> −${g.cost} SC → ${dest} <span style="color:#8a95a3">(bal ${g.balance})</span>`
      : `[${fmtT(g.tick)}] <span style="color:${teamColor(g.team)}">${esc(g.team)}</span> <span class="crim">REJECTED</span> ${esc(g.item)} (${esc(g.reason)})`;
    tick.prepend(d);
  }
  let sndStolenNew = false;
  for (const ic of m.interceptions) {
    const key = 'i' + ic.tick + ic.item + ic.looter_slot;
    if (tickerKeys.has(key)) continue;
    tickerKeys.add(key);
    const d = document.createElement('div'); d.className = 'row';
    const looter = ic.looter_slot < 0 ? '?' : ic.looter_slot;
    d.innerHTML = ic.recipient_slot < 0
      ? `[${fmtT(ic.tick)}] <span class="gold">${esc(ic.item.toUpperCase())} CLAIMED BY AGENT P${looter}</span>`
      : ic.stolen
      ? `[${fmtT(ic.tick)}] <span class="steal">⚠ ${esc(ic.item.toUpperCase())} STOLEN BY AGENT P${ic.looter_slot}</span> (meant for P${ic.recipient_slot})`
      : `[${fmtT(ic.tick)}] ${esc(ic.item.toUpperCase())} secured by P${looter}`;
    tick.prepend(d);
    if (ic.recipient_slot >= 0 && ic.stolen) sndStolenNew = true;
  }
  if (sndStolenNew) sfxStolen();
  // live chat: agent-authored text — esc() is mandatory (XSS)
  const comms = el('comms');
  for (const c of (m.chat || [])) {
    const key = 'c' + c.tick + '_' + c.from + '_' + (c.to ?? -1);
    if (tickerKeys.has(key)) continue;
    tickerKeys.add(key);
    const d = document.createElement('div');
    d.className = 'row' + (c.channel === 'team' ? ' ch-team' : c.channel === 'dm' ? ' ch-dm' : '');
    const tag = c.channel === 'dm' ? '→P' + c.to : c.channel === 'team' ? '·team' : '';
    d.innerHTML = `[${fmtT(c.tick)}] <b>P${c.from}${tag}</b>: ${esc(c.text)}`;
    comms.prepend(d);
  }
  const ordinal = n => n + (n % 100 > 10 && n % 100 < 14 ? 'TH' : ({1:'ST',2:'ND',3:'RD'}[n % 10] || 'TH'));
  let sndSettleNew = 0;
  for (const st of (m.settlements || [])) {
    const key = 'set' + st.victim;
    if (tickerKeys.has(key)) continue;
    tickerKeys.add(key);
    const d = document.createElement('div'); d.className = 'row settle';
    const by = st.killer >= 0 ? ' BY P' + st.killer : ' · ARENA';
    d.innerHTML = `[${fmtT(st.tick)}] <span style="color:${teamColor(st.team)}">${esc(st.team)}</span> <span class="victim">P${st.victim}</span> SETTLED · ${ordinal(st.placement)}${by}`;
    tick.prepend(d);
    // one thunk per new row, staggered; capped so a backlog burst can't clip
    if (sndSettleNew < 4) sfxThunk(sndSettleNew * 0.15);
    sndSettleNew++;
  }

  // stat matrix: hidden until the alloc deadline, immutable after
  if (m.stats_locked) {
    el('lockTag').textContent = '· LOCKED';
    el('matrix').tBodies[0].innerHTML = m.agents.map(a =>
      `<tr class="${a.alive ? '' : 'dead'}">
        <td style="text-align:left"><span class="team-chip chip-${esc(a.team)}" style="background-color:${teamColor(a.team)}"></span>P${a.slot}</td>
        <td>${a.stats.speed}</td><td>${a.stats.strength}</td>
        <td>${a.stats.intelligence}</td><td>${a.stats.athleticism}</td>
      </tr>`).join('');
    el('matrixNote').textContent = 'Immutable since t=' + m.alloc_deadline_tick + ' (' + fmtT(m.alloc_deadline_tick) + ')';
  } else {
    el('matrixNote').textContent = 'Allocations seal at t=' + m.alloc_deadline_tick + ' (' + fmtT(m.alloc_deadline_tick) + ')';
  }

  // FINALE overlay
  if (m.finale && !finaleShown) {
    finaleShown = true;
    el('finale').style.display = 'flex';
    setTimeout(() => { el('finale').style.display = 'none'; }, 6000);
    sfxFinale();
  }
  if (m.winner_slot >= 0) {
    const w = m.agents.find(a => a.slot === m.winner_slot);
    el('winner').firstElementChild.textContent = 'WINNER  P' + m.winner_slot + (w ? ' · TEAM ' + w.team : '');
    el('winner').style.display = 'flex';
    if (!winnerSounded && sndActive()) { winnerSounded = true; sfxWinner(); }
  }
};
</script>
</body>
</html>
