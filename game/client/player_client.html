<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zero Sum - Agent Cam</title>
<style>
  :root { --bg:#0B0C10; --panel:#1F2833; --teal:#66FCF1; --gold:#C5A059;
          --crim:#FF0055; --toxic:#39FF14; --hurt:#FFA500; --text:#C5C6C7;
          /* HP semaphore (VISUAL_REDESIGN §3.1): no green — green is poison */
          --hpok:#A5E3EE; --hphurt:#FFB454; --hpcrit:#FF4A36; }
  body { font-family: 'Consolas', monospace; background: var(--bg); color: var(--text);
         margin: 0; padding: 10px; display: flex; gap: 12px; }
  #left { flex: 0 0 auto; }
  canvas { border: 1px solid var(--panel); image-rendering: pixelated; display: block; }
  .panel { background: var(--panel); border: 1px solid #2b3a4a; border-radius: 3px;
           padding: 6px 8px; margin-bottom: 8px; }
  #right { flex: 0 0 300px; display: flex; flex-direction: column; min-height: 96vh; }
  #hud { color: var(--teal); font-size: 13px; letter-spacing: 1px; }
  #hpbarWrap { background: #0d1117; height: 14px; border: 1px solid #2b3a4a; margin: 4px 0; }
  #hpbar { height: 100%; width: 100%; background: var(--hpok); transition: width .2s; }
  .tag { display: inline-block; padding: 1px 5px; margin: 1px 2px; font-size: 10px;
         border-radius: 2px; color: #0B0C10; font-weight: bold; }
  .tag.poison { background: var(--hpcrit); color: #fff; } .tag.netted { background: #c0c8d0; }
  .tag.channeling { background: var(--teal); } .tag.camo_revealed { background: var(--crim); color:#fff; }
  #stats, #inv, #zoneinfo, #ares { font-size: 11px; }
  #inv b { color: var(--gold); }
  #hdr { color: var(--teal); font-size: 13px; letter-spacing: 2px; }
  #note { color: #8a95a3; font-size: 10px; }
  @media (prefers-reduced-motion: reduce) {
    #hpbar { transition: none; }
  }
  #chatlog { font-size: 11px; flex: 1 1 auto; min-height: 90px; overflow-y: auto;
             white-space: pre-wrap; }
  .crit { color: var(--crim); } .warn { color: var(--hurt); } .ok { color: var(--hpok); }
  #banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center;
            font-size: 28px;
            color: var(--gold); text-shadow: 0 0 12px #000; letter-spacing: 4px;
            pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="left" style="position:relative">
  <canvas id="cv" width="672" height="672"></canvas>
  <div id="banner"></div>
  <div class="panel"><div id="hdr">Zero Sum - Agent Cam</div><div id="note">read-only broadcast view</div></div>
</div>
<div id="right">
  <div class="panel">
    <div id="hud">CONNECTING&hellip;</div>
    <div id="hpbarWrap"><div id="hpbar"></div></div>
    <div id="tags"></div>
    <div id="stats"></div>
  </div>
  <div class="panel" id="inv"></div>
  <div class="panel" id="zoneinfo"></div>
  <div class="panel" id="ares"></div>
  <div class="panel" style="flex:1 1 auto; display:flex; flex-direction:column">
    <div id="chatlog"></div>
  </div>
</div>
<script>
// WS contract (DESIGN §11): ?address= override, else same-origin rewrite.
const pageUrl = new URL(window.location.href);
function websocketAddress(path) {
  const address = pageUrl.searchParams.get('address');
  const target = new URL(address || window.location.href, window.location.href);
  if (target.protocol === 'http:') target.protocol = 'ws:';
  if (target.protocol === 'https:') target.protocol = 'wss:';
  if (!address) target.pathname = target.pathname.replace(/\/client\/player$/, path);
  for (const key of ['slot']) {
    const v = pageUrl.searchParams.get(key);
    if (v !== null) target.searchParams.set(key, v);
  }
  target.hash = '';
  return target;
}
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const el = id => document.getElementById(id);
let cfg = null;
// Team accents (DESIGN §21.3) — index = slot>>1
const TEAM = ['#FF7F8C','#45DCFF','#FFBF00','#7A3CDC','#DC143C','#EBF5FF','#FF6E1E','#E15AEB'];
const BAND = { healthy: '#A5E3EE', hurt: '#FFB454', critical: '#FF4A36' };
const WEAPON_GLYPH = { sword:'S', spear:'P', bow:'B', knives:'K', blowgun:'G', net:'N',
                       first_aid:'+', rations:'R', backpack:'Δ', camo:'C', arrows:'a', darts:'d' };
const ITEM_GLYPH = { sword:'⚔', spear:'†', bow:'D', arrows:'➹', knives:'✕', blowgun:'~',
                     darts:'·', net:'#', first_aid:'✚', rations:'▲', backpack:'◘', camouflage:'▒' };
const S = 14;             // px per tile
// LOS mirror of obs.nim losClear: Bresenham, blocked by '#'/'R'/'F'
let blockMap = null;
function losClear(ax, ay, bx, by) {
  let x0 = ax, y0 = ay;
  const dx = Math.abs(bx - x0), dy = -Math.abs(by - y0);
  const sx = x0 < bx ? 1 : -1, sy = y0 < by ? 1 : -1;
  let err = dx + dy;
  while (true) {
    if (!(x0 === ax && y0 === ay) && !(x0 === bx && y0 === by)) {
      if (blockMap[y0][x0]) return false;
    }
    if (x0 === bx && y0 === by) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
  return true;
}
// crosshatch pattern for LOS shadow
const hatch = document.createElement('canvas'); hatch.width = hatch.height = 6;
{ const h = hatch.getContext('2d');
  h.strokeStyle = 'rgba(102,252,241,0.14)'; h.lineWidth = 1;
  h.beginPath(); h.moveTo(0, 6); h.lineTo(6, 0); h.stroke(); }
let hatchPat = null;
const RM = window.matchMedia &&
           window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// arena-wide event state (public by design — drawn over fog)
let fx = [];        // transient markers: {kind, x, y, born, ttl}
let bearings = [];  // vision-rim ticks: {dir, color, born, ttl}
let hazards = [];   // scheduled hazards: {kind, rect|center+radius, from, until}
const deadSeen = new Set();

const ws = new WebSocket(websocketAddress('/watch'));
ws.onopen = () => { el('hud').textContent = 'CONNECTED — AWAITING FEED'; };
ws.onclose = () => { el('hud').textContent = 'DISCONNECTED'; };
let bannerUntil = 0;
function showBanner(txt, color) {
  const b = el('banner'); b.textContent = txt; b.style.color = color || '#C5A059';
  b.style.display = 'block'; bannerUntil = Date.now() + 4000;
  setTimeout(() => { if (Date.now() >= bannerUntil) b.style.display = 'none'; }, 4100);
}
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.type === 'player_config') {
    cfg = m;
    cfg.itemDefs = {};
    for (const d of cfg.items) cfg.itemDefs[d.id] = d;
    blockMap = cfg.arena.static_map.map(row => [...row].map(ch => ch === '#' || ch === 'R' || ch === 'F'));
    hatchPat = ctx.createPattern(hatch, 'repeat');
    return;
  }
  if (m.type === 'final') {
    el('hud').textContent = `FINAL  PLACE ${m.placement}  SCORE ${m.score}  WINNER P${m.winner_slot}`;
    showBanner(m.reason === 'winner' ? 'VICTORY' : 'ELIMINATED',
               m.reason === 'winner' ? '#C5A059' : '#FF0055');
    return;
  }
  if (m.type !== 'observation' || !cfg) return;
  const you = m.you, N = cfg.arena.size;
  const vr = 5 + ((you.stats.intelligence + 1) >> 1);
  const [px, py] = you.pos;

  // ---- side panels ----
  const secs = Math.floor(m.tick / 24);
  el('hud').textContent = `WATCHING P${cfg.slot} ${String(m.phase).replace('ph','').toUpperCase()}  T ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}  HP ${you.hp}  K ${you.kills}  ALIVE ${16 - deadSeen.size}`;
  const band = you.hp > 66 ? 'healthy' : you.hp >= 33 ? 'hurt' : 'critical';
  const bar = el('hpbar'); bar.style.width = you.hp + '%'; bar.style.background = BAND[band];
  el('tags').innerHTML = you.effects.map(e =>
    `<span class="tag ${e.id}">${e.id.toUpperCase()}${e.ticks_left ? ' ' + Math.ceil(e.ticks_left/24) + 's' : ''}</span>`).join('');
  el('stats').textContent = `SPD ${you.stats.speed}  STR ${you.stats.strength}  INT ${you.stats.intelligence}  ATH ${you.stats.athleticism}   VIS ${vr}`;
  const dur = you.hand.durability !== undefined ? ` (${you.hand.durability})` : '';
  const n = you.hand.n !== undefined ? ` ×${you.hand.n}` : '';
  let inv = `HAND <b>${you.hand.id}</b>${dur}${n}   BODY <b>${you.body || '—'}</b><br>`;
  (you.pack || []).forEach((p, i) => {
    inv += `[${i+1}] ` + (p ? `<b>${p.id}</b>${p.n > 1 ? ' ×' + p.n : ''}${p.durability !== undefined ? ' (' + p.durability + ')' : ''}` : '·') + '  ';
  });
  el('inv').innerHTML = inv;
  const zdps = m.zone.damage_per_s;
  el('zoneinfo').innerHTML =
    `RING <span class="${zdps >= 8 ? 'crit' : zdps > 0 ? 'warn' : 'ok'}">r=${m.zone.radius} → ${m.zone.next_radius}</span>  DMG ${zdps}/s` +
    (m.zone.shrink_tick > m.tick ? `  SHRINK IN ${Math.ceil((m.zone.shrink_tick - m.tick)/24)}s` : '');
  el('ares').textContent = `LAST: ${you.action_result || '—'}` +
    (you.damage_taken.length ? '   HIT: ' + you.damage_taken.map(d => `${d.source} ${d.amount}`).join(', ') : '');
  for (const c of m.chat) {
    el('chatlog').textContent = `[P${c.from}${c.channel === 'dm' ? '→' + c.to : c.channel === 'team' ? '·team' : ''}] ${c.text}\n` + el('chatlog').textContent;
  }
  if (el('chatlog').textContent.length > 20000)
    el('chatlog').textContent = el('chatlog').textContent.slice(0, 20000);
  for (const e of m.events) {
    if (e.type === 'ignition') showBanner('IGNITION', '#C5A059');
    else if (e.type === 'finale') showBanner('CIVIL WAR', '#FF0055');
    else if (e.type === 'zone_warning') showBanner('RING SHRINKS TO ' + e.r_end, '#FFA500');
    else if (e.type === 'death_fireworks') {
      if (e.slot >= 0) deadSeen.add(e.slot);
      if (e.pos) fx.push({kind: 'death', x: e.pos[0], y: e.pos[1], born: m.tick, ttl: 48});
    }
    else if (e.type === 'boom')
      bearings.push({dir: e.direction, color: '#FF4A36', born: m.tick, ttl: 48});
    else if (e.type === 'mine_explosion' && e.pos)
      fx.push({kind: 'mine', x: e.pos[0], y: e.pos[1], born: m.tick, ttl: 24});
    else if (e.type === 'event_warning') {
      // payload keeps its inner "kind" (flood|firestorm) beside "type"
      hazards.push({kind: e.kind, rect: e.rect, center: e.center, radius: e.radius,
                    from: e.from_tick, until: e.from_tick + e.duration});
      showBanner((e.kind === 'flood' ? 'FLOOD' : 'FIRESTORM') + ' INCOMING', '#FF4FA3');
    }
    else if (e.type === 'gift_incoming' && e.pos)
      fx.push({kind: 'gift', x: e.pos[0], y: e.pos[1], born: m.tick,
               ttl: Math.max(1, e.lands_tick - m.tick)});
    else if (e.type === 'gift_landed' && e.pos)
      fx.push({kind: 'gift', x: e.pos[0], y: e.pos[1], born: m.tick, ttl: 72});
  }
  fx = fx.filter(f => m.tick - f.born < f.ttl);
  bearings = bearings.filter(b => m.tick - b.born < b.ttl);
  hazards = hazards.filter(h => m.tick < h.until);

  // ---- tactical map ----
  ctx.fillStyle = '#0B0C10'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = x - px, dy = y - py;
    const inRadius = dx*dx + dy*dy <= vr*vr;
    const seen = inRadius && losClear(px, py, x, y);
    const t = cfg.arena.static_map[y][x];
    // terrain (public in player_config): full color when seen, ghost elsewhere
    let col = null;
    if (t === '#') col = '#3a4552'; else if (t === 'F') col = '#4a5867';
    else if (t === 'R') col = '#5a4a3a'; else if (t === 'P') col = '#C5A059';
    else if (t === 'B') col = '#1e5c28';
    if (seen) {
      ctx.fillStyle = '#12141b'; ctx.fillRect(x*S, y*S, S, S);
      if (col) { ctx.fillStyle = col; ctx.fillRect(x*S, y*S, S, S); }
      ctx.strokeStyle = 'rgba(31,40,51,0.6)'; ctx.strokeRect(x*S+.5, y*S+.5, S-1, S-1);
    } else {
      // fog hides only dynamic signal — the static map is public in
      // player_config, so remembered terrain stays readable (schematic)
      if (col) { ctx.globalAlpha = 0.4; ctx.fillStyle = col; ctx.fillRect(x*S, y*S, S, S); ctx.globalAlpha = 1; }
      if (inRadius) { ctx.fillStyle = hatchPat; ctx.fillRect(x*S, y*S, S, S); } // LOS shadow crosshatch
    }
  }
  // zone ring: teal plasma, crimson once crit
  ctx.lineWidth = 2;
  ctx.strokeStyle = zdps >= 8 ? '#FF0055' : '#66FCF1';
  ctx.beginPath(); ctx.arc(m.zone.center[0]*S + S/2, m.zone.center[1]*S + S/2, m.zone.radius*S, 0, 7); ctx.stroke();
  if (m.zone.next_radius < m.zone.radius) {
    ctx.setLineDash([4, 5]); ctx.strokeStyle = 'rgba(255,0,85,0.5)';
    ctx.beginPath(); ctx.arc(m.zone.center[0]*S + S/2, m.zone.center[1]*S + S/2, m.zone.next_radius*S, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.lineWidth = 1;
  ctx.font = '9px Consolas'; ctx.textBaseline = 'top';
  // hazards (arena-wide): dashed magenta while scheduled, red wash once live
  for (const h of hazards) {
    const active = m.tick >= h.from;
    ctx.strokeStyle = '#FF4FA3'; ctx.lineWidth = active ? 2 : 1;
    if (!active) ctx.setLineDash([5, 4]);
    ctx.fillStyle = active ? 'rgba(255,74,54,0.20)' : 'rgba(255,79,163,0.08)';
    let lx = 2, ly = 2;
    if (h.kind === 'flood' && h.rect) {
      const [x0, y0, x1, y1] = h.rect;
      ctx.fillRect(x0*S, y0*S, (x1-x0+1)*S, (y1-y0+1)*S);
      ctx.strokeRect(x0*S+.5, y0*S+.5, (x1-x0+1)*S-1, (y1-y0+1)*S-1);
      lx = x0*S; ly = y0*S - 10;
    } else if (h.center) {
      const hx = h.center[0]*S + S/2, hy = h.center[1]*S + S/2;
      ctx.beginPath(); ctx.arc(hx, hy, (h.radius + 0.5)*S, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      lx = hx - 20; ly = hy - (h.radius + 1)*S - 10;
    }
    ctx.setLineDash([]); ctx.lineWidth = 1;
    if (!active) {
      ctx.fillStyle = '#FF4FA3';
      ctx.fillText(h.kind.toUpperCase() + ' T-' + Math.ceil((h.from - m.tick)/24) + 's',
                   Math.max(2, lx), Math.max(2, ly));
    }
  }
  // bushes: charge integers
  for (const b of m.visible.bushes) {
    ctx.fillStyle = '#2e8c3c'; ctx.fillRect(b.pos[0]*S+2, b.pos[1]*S+2, S-4, S-4);
    ctx.fillStyle = '#fff'; ctx.fillText(String(b.charges), b.pos[0]*S+5, b.pos[1]*S+3);
  }
  // ground items: symbol + count
  for (const it of m.visible.items) {
    ctx.fillStyle = '#C5A059';
    ctx.fillText((ITEM_GLYPH[it.id] || '?') + (it.n > 1 ? it.n : ''), it.pos[0]*S+2, it.pos[1]*S+3);
  }
  // pods: gold diamond inbound / gold crate landed, item label
  for (const p of m.visible.pods) {
    const cx = p.pos[0]*S + S/2, cy = p.pos[1]*S + S/2;
    ctx.strokeStyle = '#C5A059'; ctx.fillStyle = p.landed ? '#C5A059' : 'rgba(197,160,89,0.25)';
    ctx.beginPath(); ctx.moveTo(cx, cy-6); ctx.lineTo(cx+6, cy); ctx.lineTo(cx, cy+6); ctx.lineTo(cx-6, cy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#C5A059'; ctx.fillText(p.item, cx - 3*p.item.length, cy - 14);
  }
  // projectiles: tracer + direction tail
  const DIRV = {N:[0,-1],NE:[1,-1],E:[1,0],SE:[1,1],S:[0,1],SW:[-1,1],W:[-1,0],NW:[-1,-1]};
  for (const p of m.visible.projectiles) {
    const cx = p.pos[0]*S + S/2, cy = p.pos[1]*S + S/2;
    const v = DIRV[p.dir] || [0,0];
    ctx.strokeStyle = 'rgba(235,245,255,0.6)';
    ctx.beginPath(); ctx.moveTo(cx - v[0]*8, cy - v[1]*8); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.fillStyle = '#EBF5FF'; ctx.fillRect(cx-1, cy-1, 3, 3);
  }
  // enemy/teammate tokens: team accent core, hp-band ring, weapon glyph, status pips
  for (const a of m.visible.agents) {
    const cx = a.pos[0]*S + S/2, cy = a.pos[1]*S + S/2;
    const mate = (a.slot >> 1) === (cfg.slot >> 1);
    ctx.fillStyle = TEAM[a.slot >> 1];
    ctx.beginPath();
    if (mate) { ctx.moveTo(cx, cy-6); ctx.lineTo(cx+6, cy); ctx.lineTo(cx, cy+6); ctx.lineTo(cx-6, cy); ctx.closePath(); }
    else ctx.arc(cx, cy, 5, 0, 7);
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = BAND[a.hp_band] || '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 6.5, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
    if (a.hand && a.hand !== 'none') {
      ctx.fillStyle = '#0B0C10'; ctx.fillText(WEAPON_GLYPH[a.hand] || '?', cx-2.5, cy-4);
    }
    let pip = 0;
    const pips = [];
    if (a.poisoned) pips.push('#FF4A36');
    if (a.netted) pips.push('#c0c8d0');
    if (a.channeling) pips.push('#66FCF1');
    for (const c of pips) { ctx.fillStyle = c; ctx.fillRect(cx - 6 + pip*5, cy - 11, 4, 3); pip++; }
    ctx.fillStyle = '#C5C6C7'; ctx.fillText('P' + a.slot, cx - 5, cy + 8);
  }
  // self token: cyan, cooldown gauges, stacked status tags drawn as pips
  {
    const cx = px*S + S/2, cy = py*S + S/2;
    ctx.strokeStyle = 'rgba(102,252,241,0.35)';
    ctx.beginPath(); ctx.arc(cx, cy, vr*S, 0, 7); ctx.stroke();   // vision edge
    ctx.fillStyle = '#66FCF1';
    ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#EBF5FF'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
    // cooldown gauges under token: move (cyan) + attack (gold)
    const mvCd = Math.max(1, 16 - you.stats.speed);
    const mv = 1 - Math.min(1, you.move_ready_in / mvCd);
    const atkTotal = (you.hand && cfg.itemDefs[you.hand.id]) ? cfg.itemDefs[you.hand.id].cooldown || 12 : 12;
    const atk = 1 - Math.min(1, you.attack_ready_in / atkTotal);
    ctx.fillStyle = '#0d1117'; ctx.fillRect(cx-8, cy+9, 16, 2); ctx.fillRect(cx-8, cy+12, 16, 2);
    ctx.fillStyle = '#66FCF1'; ctx.fillRect(cx-8, cy+9, 16*mv, 2);
    ctx.fillStyle = '#C5A059'; ctx.fillRect(cx-8, cy+12, 16*atk, 2);
  }
  // arena-wide event markers, drawn over fog (public by design)
  for (const f of fx) {
    const age = (m.tick - f.born) / f.ttl;
    const cx = f.x*S + S/2, cy = f.y*S + S/2;
    if (f.kind === 'death') {
      ctx.globalAlpha = RM ? 0.7 : 1 - age;
      ctx.strokeStyle = '#E9E4D8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, RM ? 10 : 4 + age*18, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#FF4A36'; ctx.fillRect(cx-2, cy-2, 4, 4);
    } else if (f.kind === 'mine') {
      ctx.globalAlpha = RM ? 0.7 : 1 - age;
      ctx.strokeStyle = '#FF4A36'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, RM ? 6 : 3 + age*10, 0, Math.PI*2); ctx.stroke();
    } else {                       // gift: amber ping at the drop tile
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = '#C5A059'; ctx.lineWidth = 1;
      const p = RM ? 0.4 : ((m.tick - f.born) % 48) / 48;
      ctx.beginPath(); ctx.arc(cx, cy, 3 + p*14, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
  // boom bearing ticks on the vision rim (direction-only, per protocol)
  {
    const cx = px*S + S/2, cy = py*S + S/2;
    const ANG = {N: -Math.PI/2, NE: -Math.PI/4, E: 0, SE: Math.PI/4,
                 S: Math.PI/2, SW: 3*Math.PI/4, W: Math.PI, NW: -3*Math.PI/4};
    for (const b of bearings) {
      const a = ANG[b.dir];
      if (a === undefined) continue;
      ctx.globalAlpha = 1 - (m.tick - b.born) / b.ttl;
      ctx.strokeStyle = b.color; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*(vr*S - 6), cy + Math.sin(a)*(vr*S - 6));
      ctx.lineTo(cx + Math.cos(a)*(vr*S + 6), cy + Math.sin(a)*(vr*S + 6));
      ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
  }
};
</script>
</body>
</html>
