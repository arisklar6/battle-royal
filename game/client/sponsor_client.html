<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Battle Royal - Sponsor Console v0.2</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
    background: #0C1116;
    color: #C5C6C7;
    margin: 0;
    padding: 12px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #16202B;
    padding: 10px 14px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  #teamchip {
    width: 18px; height: 18px;
    background: #3a4552;
    border: 1px solid #0C1116;
    flex: 0 0 auto;
  }
  #teamname { font-size: 16px; font-weight: bold; letter-spacing: 1px; }
  #alive { font-size: 12px; color: #C5C6C7; opacity: 0.8; }
  .spacer { flex: 1; }
  #budget { font-size: 20px; color: #FFB454; font-weight: bold; }
  #countdown { font-size: 14px; min-width: 170px; text-align: right; }
  #countdown.locked { color: #FF4A36; font-weight: bold; }
  #countdown.closed { color: #A5E3EE; }
  #countdown.open { color: #A5E3EE; }
  #status { font-size: 11px; opacity: 0.7; }
  #status.on { color: #A5E3EE; opacity: 1; }
  #status.off { color: #FF4A36; opacity: 1; }
  main { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: #16202B; padding: 10px; }
  #map { display: block; background: #12141b; cursor: crosshair; }
  #sel { font-size: 12px; margin-top: 8px; color: #A5E3EE; min-height: 15px; }
  #right { flex: 1; min-width: 300px; max-width: 460px; }
  h2 {
    font-size: 12px; letter-spacing: 2px; color: #C5C6C7;
    border-bottom: 1px solid #0C1116; padding-bottom: 4px;
    margin: 0 0 8px 0;
  }
  h2 + h2, #log { margin-top: 6px; }
  #shop { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #shop button {
    font-family: Consolas, monospace;
    font-size: 12px;
    background: #0C1116;
    color: #C5C6C7;
    border: 1px solid #A5E3EE;
    padding: 6px 10px;
    cursor: pointer;
  }
  #shop button .price { color: #FFB454; }
  #shop button:hover:not(:disabled) { background: #A5E3EE; color: #0C1116; }
  #shop button:hover:not(:disabled) .price { color: #0C1116; }
  #shop button:disabled {
    border-color: #3a4552; color: #8a95a3; cursor: not-allowed;
  }
  #shop button:disabled .price { color: #8a95a3; }
  #confirm {
    display: none; margin-bottom: 10px; padding: 8px 10px;
    border: 1px solid #FFB454; font-size: 12px; color: #FFB454;
  }
  #confirm.show { display: block; }
  #confirm button {
    font-family: Consolas, monospace; font-size: 12px; cursor: pointer;
    background: #0C1116; padding: 4px 10px; margin-left: 8px;
  }
  #confirmYes { color: #FFB454; border: 1px solid #FFB454; }
  #confirmYes:hover { background: #FFB454; color: #0C1116; }
  #confirmNo { color: #C5C6C7; border: 1px solid #3a4552; }
  #coords { font-size: 12px; margin-top: 6px; color: #8a95a3; }
  #coords input {
    width: 52px; background: #0C1116; color: #C5C6C7;
    border: 1px solid #3a4552; font-family: Consolas, monospace;
    font-size: 12px; padding: 3px 5px;
  }
  #coords input:focus, #confirm button:focus, #shop button:focus {
    outline: 2px solid #A5E3EE; outline-offset: 1px;
  }
  #legend {
    font-size: 11px; margin-top: 6px; color: #8a95a3;
    display: flex; flex-wrap: wrap; gap: 3px 12px; max-width: 576px;
  }
  #legend i {
    display: inline-block; width: 9px; height: 9px; margin-right: 4px;
    vertical-align: -1px;
  }
  #toast {
    min-height: 16px; font-size: 12px; color: #FF4A36;
    margin-bottom: 10px; visibility: hidden;
  }
  #toast.show { visibility: visible; }
  #log { list-style: none; margin: 0; padding: 0; font-size: 11px; }
  #log li { padding: 2px 0; border-bottom: 1px solid rgba(11,12,16,0.5); }
  #log li.ok { color: #A5E3EE; }
  #log li.bad { color: #FF4A36; }
</style>
</head>
<body>
<header>
  <div id="teamchip"></div>
  <div id="teamname">TEAM ?</div>
  <div id="alive"></div>
  <div class="spacer"></div>
  <div id="budget">&mdash;</div>
  <div id="countdown"></div>
  <div id="status">connecting&hellip;</div>
</header>
<main>
  <section class="panel">
    <canvas id="map" width="576" height="576"></canvas>
    <div id="sel">click a tile (or use arrow keys) to set the drop target</div>
    <div id="coords">
      target
      x <input id="cx" type="number" min="0" max="47" inputmode="numeric">
      y <input id="cy" type="number" min="0" max="47" inputmode="numeric">
    </div>
    <div id="legend">
      <span><i style="background:#3a4552"></i>wall</span>
      <span><i style="background:#4a5867"></i>fortress</span>
      <span><i style="background:#5a4a3a"></i>rock</span>
      <span><i style="background:#FFB454"></i>pedestal</span>
      <span><i style="background:#1e5c28"></i>bush</span>
      <span><i style="background:#FFB454; transform:rotate(45deg)"></i>airdrop</span>
      <span><i style="background:#FF4FA3; height:2px; vertical-align:2px"></i>ring (dashed = next)</span>
      <span><i style="border:1px solid #A5E3EE; background:none"></i>your agents</span>
    </div>
  </section>
  <section class="panel" id="right">
    <h2>SUPPLY DROPS</h2>
    <div id="shop"></div>
    <div id="confirm"><span id="confirmTxt"></span>
      <button id="confirmYes">CONFIRM</button>
      <button id="confirmNo">CANCEL</button>
    </div>
    <div id="toast"></div>
    <h2>EVENT LOG</h2>
    <ul id="log"></ul>
  </section>
</main>
<script>
'use strict';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Client-page WS contract (DESIGN Â§11): honor ?address= when present, else
// same-origin derivation with the /client/sponsor -> /sponsor path rewrite.
const pageUrl = new URL(window.location.href);
function websocketAddress(path) {
  const address = pageUrl.searchParams.get('address');
  const target = new URL(address || window.location.href, window.location.href);
  if (target.protocol === 'http:') target.protocol = 'ws:';
  if (target.protocol === 'https:') target.protocol = 'wss:';
  if (!address) target.pathname = target.pathname.replace(/\/client\/sponsor$/, path);
  for (const key of ['team', 'token']) {
    const v = pageUrl.searchParams.get(key);
    if (v !== null) target.searchParams.set(key, v);
  }
  target.hash = '';
  return target;
}

const TEAM_ACCENTS = {A:'#FF8FA8', B:'#49C7E8', C:'#E8C558', D:'#9B7BFF',
                      E:'#E85D75', F:'#9FB8D8', G:'#E8975D', H:'#D97BE8'};
const TILE_COLORS = {'#':'#3a4552', 'F':'#4a5867', 'R':'#5a4a3a',
                     'P':'#FFB454', 'B':'#1e5c28'};
const TPS = 24;           // ticks per second
const TILE = 12;          // px per tile

// fallback only; sponsor_welcome carries the authoritative catalog
let CATALOG = {rations: 20, knives: 30, arrows: 30, darts: 35, net: 50,
               first_aid: 60, backpack: 70, camouflage: 80, spear: 90,
               blowgun: 100, sword: 120, bow: 150};

let team = null;
let budget = null;
let shopOpensTick = null;
let lockoutTicks = 1440;
let lockoutEndTick = 0;   // absolute tick when lockout ends
let arenaSize = 48;
let staticMap = null;
let lastTick = 0;
let lastTickAt = performance.now();
let wsOpen = false;
let selected = null;      // [x, y] target tile
let staged = null;        // {item, price} awaiting explicit confirm
let zone = null;          // {radius, next_radius, shrink_tick}
let pods = [];            // public pod list: {pos, item, landed}
let mates = [];           // own team: {slot, pos, hp_band}
const BAND_COLORS = {healthy: '#A5E3EE', hurt: '#FFB454', critical: '#FF4A36'};
const markers = [];       // {x, y, item, landsTick} persisted for the match
const pending = {};       // request_id -> {item, target}
const logEntries = [];    // {text, ok} newest first, capped at 10

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const shopEl = document.getElementById('shop');
const toastEl = document.getElementById('toast');
const logEl = document.getElementById('log');
const budgetEl = document.getElementById('budget');
const countdownEl = document.getElementById('countdown');
const statusEl = document.getElementById('status');
const selEl = document.getElementById('sel');
let shopButtons = [];     // {btn, item, price}
let toastTimer = null;

function estTick() {
  return lastTick + (performance.now() - lastTickAt) / 1000 * TPS;
}
function syncTick(t) {
  if (typeof t === 'number') { lastTick = t; lastTickAt = performance.now(); }
}
function secs(ticks) { return Math.max(0, Math.ceil(ticks / TPS)); }

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
}

function addLog(text, ok) {
  logEntries.unshift({text, ok});
  if (logEntries.length > 10) logEntries.length = 10;
  logEl.innerHTML = logEntries
    .map(e => `<li class="${e.ok ? 'ok' : 'bad'}">${esc(e.text)}</li>`)
    .join('');
}

function setBudget(v) {
  if (typeof v === 'number') { budget = v; budgetEl.textContent = v + ' sc'; }
}

function itemLabel(id) { return String(id).replace(/_/g, ' '); }

function buildShop() {
  shopEl.innerHTML = '';
  shopButtons = [];
  for (const [item, price] of Object.entries(CATALOG)) {
    const b = document.createElement('button');
    b.disabled = true;
    b.innerHTML = `${esc(itemLabel(item))} <span class="price">${esc(price)}</span>`;
    b.onclick = () => stage(item, price);
    shopEl.appendChild(b);
    shopButtons.push({btn: b, item, price});
  }
}

function setTarget(x, y) {
  x = Math.max(0, Math.min(arenaSize - 1, x));
  y = Math.max(0, Math.min(arenaSize - 1, y));
  selected = [x, y];
  selEl.textContent = `target: (${x}, ${y})`;
  document.getElementById('cx').value = x;
  document.getElementById('cy').value = y;
  updateConfirm();
}

// spending real budget is irreversible and lockout-punished: stage the
// purchase, then require an explicit confirm
function stage(item, price) {
  if (!selected || !wsOpen) return;
  staged = {item, price};
  updateConfirm();
}

function updateConfirm() {
  const bar = document.getElementById('confirm');
  if (staged && selected) {
    document.getElementById('confirmTxt').textContent =
      `SEND ${itemLabel(staged.item).toUpperCase()} ${staged.price} SC → (${selected[0]},${selected[1]})?`;
    bar.classList.add('show');
  } else {
    bar.classList.remove('show');
  }
}

function confirmBuy() {
  if (!staged || !selected || !wsOpen) return;
  const request_id = 'r' + Math.random().toString(36).slice(2, 10);
  pending[request_id] = {item: staged.item, target: selected.slice()};
  ws.send(JSON.stringify({type: 'gift_request', item_id: staged.item,
                          target: selected.slice(), request_id}));
  staged = null;
  updateConfirm();
}

function cancelStage() { staged = null; updateConfirm(); }

document.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const cur = selected || [Math.floor(arenaSize / 2), Math.floor(arenaSize / 2)];
  if (e.key === 'ArrowLeft') { setTarget(cur[0] - 1, cur[1]); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { setTarget(cur[0] + 1, cur[1]); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { setTarget(cur[0], cur[1] - 1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { setTarget(cur[0], cur[1] + 1); e.preventDefault(); }
  else if (e.key === 'Enter' && staged) { confirmBuy(); e.preventDefault(); }
  else if (e.key === 'Escape') cancelStage();
});

// ---- websocket ----
const ws = new WebSocket(websocketAddress('/sponsor'));
ws.onopen = () => {
  wsOpen = true;
  statusEl.textContent = 'LIVE';
  statusEl.className = 'on';
};
ws.onclose = () => {
  wsOpen = false;
  statusEl.textContent = 'DISCONNECTED';
  statusEl.className = 'off';
};
ws.onmessage = (ev) => {
  let m;
  try { m = JSON.parse(ev.data); } catch (e) { return; }
  if (m.type === 'sponsor_welcome') {
    team = m.team;
    const accent = TEAM_ACCENTS[team] || '#A5E3EE';
    document.getElementById('teamchip').style.background = accent;
    const tn = document.getElementById('teamname');
    tn.textContent = 'TEAM ' + team;
    tn.style.color = accent;
    setBudget(m.budget);
    if (m.catalog) CATALOG = m.catalog;
    buildShop();
    if (typeof m.shop_opens_tick === 'number') shopOpensTick = m.shop_opens_tick;
    if (typeof m.lockout_ticks === 'number') lockoutTicks = m.lockout_ticks;
    if (typeof m.arena_size === 'number') arenaSize = m.arena_size;
    canvas.width = arenaSize * TILE;
    canvas.height = arenaSize * TILE;
    if (Array.isArray(m.static_map)) staticMap = m.static_map;
    syncTick(m.tick);
  } else if (m.type === 'sponsor_state') {
    setBudget(m.budget);
    if (typeof m.shop_opens_tick === 'number') shopOpensTick = m.shop_opens_tick;
    syncTick(m.tick);
    if (typeof m.lockout_remaining === 'number') {
      lockoutEndTick = m.tick + m.lockout_remaining;  // server is authoritative
    }
    if (Array.isArray(m.team_alive)) {
      document.getElementById('alive').textContent =
        'alive ' + m.team_alive.length;
    }
    if (m.zone) zone = m.zone;
    if (Array.isArray(m.pods)) pods = m.pods;
    if (Array.isArray(m.teammates)) mates = m.teammates;
  } else if (m.type === 'gift_result') {
    const req = pending[m.request_id] || {};
    delete pending[m.request_id];
    setBudget(m.balance);
    if (m.accepted) {
      const [lx, ly] = m.landing;
      markers.push({x: lx, y: ly, item: itemLabel(req.item || '?'),
                    landsTick: m.lands_tick});
      lockoutEndTick = Math.max(lockoutEndTick, estTick() + lockoutTicks);
      addLog(`DROP ${itemLabel(req.item || '?')} -> (${lx},${ly}) cost ${m.cost}`, true);
    } else {
      showToast(`REJECTED: ${m.reason}`);
      addLog(`REJECTED ${itemLabel(req.item || '?')}: ${m.reason}`, false);
    }
  }
};

// ---- map ----
canvas.addEventListener('click', (e) => {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * (canvas.width / r.width) / TILE);
  const y = Math.floor((e.clientY - r.top) * (canvas.height / r.height) / TILE);
  if (x < 0 || y < 0 || x >= arenaSize || y >= arenaSize) return;
  setTarget(x, y);
});
for (const id of ['cx', 'cy']) {
  document.getElementById(id).addEventListener('change', () => {
    const x = parseInt(document.getElementById('cx').value, 10);
    const y = parseInt(document.getElementById('cy').value, 10);
    if (Number.isInteger(x) && Number.isInteger(y)) setTarget(x, y);
  });
}
document.getElementById('confirmYes').onclick = confirmBuy;
document.getElementById('confirmNo').onclick = cancelStage;

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#12141b';
  ctx.fillRect(0, 0, w, h);
  if (staticMap) {
    for (let y = 0; y < arenaSize; y++) {
      const row = staticMap[y] || '';
      for (let x = 0; x < arenaSize; x++) {
        const c = TILE_COLORS[row[x]];
        if (c) { ctx.fillStyle = c; ctx.fillRect(x * TILE, y * TILE, TILE, TILE); }
      }
    }
  }
  // subtle grid
  ctx.strokeStyle = '#16202B';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= arenaSize; i++) {
    ctx.moveTo(i * TILE + 0.5, 0); ctx.lineTo(i * TILE + 0.5, h);
    ctx.moveTo(0, i * TILE + 0.5); ctx.lineTo(w, i * TILE + 0.5);
  }
  ctx.stroke();
  // drop markers (persist for the match)
  const et = estTick();
  ctx.font = '9px Consolas, monospace';
  for (const mk of markers) {
    const cx = mk.x * TILE + TILE / 2, cy = mk.y * TILE + TILE / 2;
    ctx.fillStyle = '#FFB454';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 5, cy);
    ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 5, cy);
    ctx.closePath();
    ctx.fill();
    ctx.textAlign = 'center';
    const above = mk.y > 1;
    ctx.fillText(mk.item, cx, above ? cy - 8 : cy + 15);
    if (typeof mk.landsTick === 'number' && et < mk.landsTick) {
      ctx.fillStyle = '#A5E3EE';
      ctx.fillText(`lands in ${secs(mk.landsTick - et)}s`,
                   cx, above ? cy - 18 : cy + 25);
    }
  }
  // ring geometry (magenta = commanded path): solid current, dashed next
  if (zone) {
    const c = arenaSize / 2 * TILE;
    ctx.strokeStyle = '#FF4FA3';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c, c, zone.radius * TILE, 0, Math.PI * 2);
    ctx.stroke();
    if (zone.next_radius < zone.radius) {
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c, c, zone.next_radius * TILE, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.lineWidth = 1;
  }
  // every pod on the field (public knowledge): hollow inbound, solid landed
  ctx.font = '9px Consolas, monospace';
  ctx.textAlign = 'center';
  for (const p of pods) {
    const cx = p.pos[0] * TILE + TILE / 2, cy = p.pos[1] * TILE + TILE / 2;
    ctx.strokeStyle = '#FFB454';
    ctx.fillStyle = p.landed ? '#FFB454' : 'rgba(197,160,89,0.25)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 5, cy);
    ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 5, cy);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFB454';
    ctx.fillText(itemLabel(p.item), cx, p.pos[1] > 1 ? cy - 8 : cy + 15);
  }
  // your agents: accent dot, hp-band ring, slot tag
  const accent = TEAM_ACCENTS[team] || '#A5E3EE';
  for (const a of mates) {
    const cx = a.pos[0] * TILE + TILE / 2, cy = a.pos[1] * TILE + TILE / 2;
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = BAND_COLORS[a.hp_band] || '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = '#C5C6C7';
    ctx.fillText('P' + a.slot, cx, cy + 8);
  }
  ctx.textAlign = 'left';
  // selection crosshair
  if (selected) {
    const [sx, sy] = selected;
    const cx = sx * TILE + TILE / 2, cy = sy * TILE + TILE / 2;
    ctx.strokeStyle = 'rgba(165,227,238,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
    ctx.moveTo(0, cy); ctx.lineTo(w, cy);
    ctx.stroke();
    ctx.strokeStyle = '#A5E3EE';
    ctx.strokeRect(sx * TILE + 0.5, sy * TILE + 0.5, TILE - 1, TILE - 1);
    ctx.fillStyle = '#A5E3EE';
    ctx.font = '10px Consolas, monospace';
    ctx.textAlign = sx > arenaSize - 8 ? 'right' : 'left';
    const tx = sx > arenaSize - 8 ? cx - 8 : cx + 8;
    ctx.fillText(`(${sx},${sy})`, tx, sy > 1 ? cy - 8 : cy + 18);
  }
}

// ---- client-side timers (24 ticks = 1 s), re-synced by sponsor_state ----
function refresh() {
  const et = estTick();
  const shopClosed = shopOpensTick !== null && et < shopOpensTick;
  const locked = et < lockoutEndTick;
  if (!wsOpen && team === null) {
    countdownEl.textContent = '';
    countdownEl.className = '';
  } else if (shopClosed) {
    countdownEl.textContent = `SHOP OPENS IN ${secs(shopOpensTick - et)}s`;
    countdownEl.className = 'closed';
  } else if (locked) {
    countdownEl.textContent = `LOCKOUT ${secs(lockoutEndTick - et)}s`;
    countdownEl.className = 'locked';
  } else {
    countdownEl.textContent = 'SHOP OPEN';
    countdownEl.className = 'open';
  }
  const noBuy = !wsOpen || !selected || shopClosed || locked;
  for (const {btn, price} of shopButtons) {
    btn.disabled = noBuy || (budget !== null && price > budget);
  }
  draw();
}
buildShop();
setInterval(refresh, 100);
refresh();
</script>
</body>
</html>
